services:
  privatemode-system-one:
    build: .
    image: privatemode-system-one
    restart: unless-stopped
    ports:
      - "127.0.0.1:8600:8600"      # a reverse proxy on the host terminates TLS and forwards here
    env_file: .env                  # SYSTEM_ONE_BASE_URL, SYSTEM_ONE_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the Privatemode proxy listens on the host's 8082
